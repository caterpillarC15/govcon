[project]
name = "mcp-server-samrail"
version = "0.1.0"
description = "MCP server exposing the SamRail capability pack's 10 tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SamRail" }]
dependencies = [
  "mcp>=1.0",
  "httpx>=0.28",
  "pydantic>=2.0",
]

[project.scripts]
mcp-server-samrail = "mcp_server_samrail.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server_samrail"]
