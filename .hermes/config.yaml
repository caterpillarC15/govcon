# Hermes config for dev testing this pack's tools.
#
# This file is consumed when a developer runs:
#   HERMES_HOME=$(pwd)/.hermes hermes
#
# It is NOT loaded by FastAPI or by any production process — those read
# api/config.py and .env directly. The orchestrator (Michaela) and the
# worker bench (Scot, Lenny, Lance, Gabby, Happer, Roy) live in
# /root/michealaai with their own ~/.hermes/.
#
# This file was previously hand-rolled with invented keys
# (delegation:, models:, providers:, telemetry:, memory.cross_session)
# that Hermes does not consume. They have been removed. Only
# schema-correct keys remain.

model:
  provider: "anthropic"
  default: "claude-sonnet-4-6"
  # api_key: read from .env's ANTHROPIC_API_KEY (do not put a literal
  # value here; commit-safety).

memory:
  memory_enabled: true
  user_profile_enabled: false  # tool-testing home, not a personal profile
  memory_char_limit: 2200
  user_char_limit: 1375
