# Hermes Agent runtime configuration for the project-isolated Michaela runtime.
#
# Layer boundary:
#   Michaela = product/application workloop.
#   Hermes = runtime shell, skill/tool harness, memory, provider config.
#   Anthropic/OpenRouter = model transport only.
#
# Run this project with an isolated Hermes home so it does not depend on a
# developer's personal/global ~/.hermes config or credentials:
#
#   export HERMES_HOME="$(pwd)/.hermes"

# ─── Delegation ─────────────────────────────────────────────────────────────
# The Michaela bench (tasks/AGENT_ARCHITECTURE.md) uses one root orchestrator
# with bounded specialist workers. Named workers are peers, not a management
# chain.
delegation:
  max_concurrent_children: 3            # Top-ranked opportunity branches in parallel
  max_spawn_depth: 2                    # REQUIRED: Michaela -> specialist/branch only
  orchestrator_enabled: true            # Global kill-switch; must be true for our design
  max_iterations: 50                    # Per-child turn cap (Hermes default)

  # Optional: per-delegation model override.
  # We keep delegation model inheritance from parent by default (commented),
  # then override per delegate_task call in the Hermes bridge for cost
  # optimization (e.g., Gabby on Sonnet, Lance/Lenny on Haiku).
  # model: "claude-sonnet-4-6"
  # provider: "anthropic"

# ─── Models ─────────────────────────────────────────────────────────────────
# Project default: direct Anthropic. Keep OpenRouter for personal/global Hermes
# or future routing experiments unless a product reason requires it.
models:
  default_synthesis: "claude-sonnet-4-6"
  default_cheap: "claude-haiku-4-5-20251001"

providers:
  anthropic:
    api_key: null
    api_key_env: ANTHROPIC_API_KEY

# ─── Skills ─────────────────────────────────────────────────────────────────
# With HERMES_HOME set to this directory, Hermes reads project-local skills from
# .hermes/skills/ without consulting ~/.hermes.
#
# Skills loaded:
#   - operate_bid_desk                   (Michaela)
#   - discover_opportunities             (Scot)
#   - analyze_opportunity_e2e            (Michaela per-opportunity recipe)
#   - extract_requirements_with_evidence (Gabby)
#   - score_fit_with_eligibility_check   (Lenny + Gabby; §11.1 enforcement)
#   - detect_risks_calibrated            (Gabby)
#   - generate_full_action_package       (Roy)
#   - generate_reject_summary            (Roy; deterministic)

# ─── Memory ─────────────────────────────────────────────────────────────────
# V1 product mode: cross-run memory is part of the "clone me into the org"
# promise. Hermes should remember declared company capabilities, certifications,
# agency preferences, past performance, recurring teammates, and prior bid/no-bid
# decisions. For deterministic evals, override this to false in the test env.
memory:
  cross_session: true

# ─── Telemetry / observability ──────────────────────────────────────────────
# Hermes emits trace events. Our /api/agent/hermes_bridge.py subscribes and
# translates into CONTRACTS.md §3 SSE events for the frontend (B5).
telemetry:
  emit_subagent_events: true
  log_tool_io: true
