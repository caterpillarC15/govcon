# infra/nginx/samrail.conf
#
# Reverse proxy → FastAPI on 127.0.0.1:8000.
# TLS is wired by `certbot --nginx -d api.samrail.com` after DNS
# points at this box; certbot edits this file in place to add the TLS block.
#
# Install:
#   sudo cp infra/nginx/samrail.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/samrail.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream govcapture_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.samrail.com;

    # Larger uploads for solicitation PDFs (PRD §5.5).
    client_max_body_size 50M;

    # Gzip the JSON / SSE responses.
    gzip on;
    gzip_types application/json text/event-stream text/plain;
    gzip_min_length 256;

    # SSE (agent-run trace stream) — disable buffering, long timeout.
    location /agent-runs/ {
        proxy_pass http://govcapture_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Everything else.
    location / {
        proxy_pass http://govcapture_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Healthcheck — bypass logs to keep noise down.
    location = /healthz {
        proxy_pass http://govcapture_api;
        access_log off;
    }
}
